# Server Port (Required for Railway)
server.port=${PORT:8080}

# Database Switching Logic
# If JDBC_DATABASE_URL exists (Railway), use Postgres. Otherwise, use H2.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:augmenzadb}
spring.datasource.username=${PGUSER:sa}
spring.datasource.password=${PGPASSWORD:password}
spring.datasource.driver-class-name=${PGDRIVER:org.h2.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Handle different Dialects automatically
spring.jpa.database-platform=${PGDIALECT:org.hibernate.dialect.H2Dialect}